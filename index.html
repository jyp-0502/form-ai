<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101719"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>FORM AI</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#f4f7f5;background:#101719}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{max-width:540px;margin:auto;padding:20px 18px 100px}h1{font-size:27px;margin:8px 0}h2{font-size:20px}small,.muted{color:#a9b9b2}.brand{color:#b7f16c;font-weight:800;letter-spacing:2px}.panel{background:#202b2b;border-radius:18px;padding:18px;margin:14px 0}.flex{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{background:#b7f16c;color:#13200e;border:0;border-radius:12px;padding:13px 16px;font-weight:750;font-size:15px;cursor:pointer}.btn.secondary{background:#344240;color:#f4f7f5}.btn:disabled{opacity:.45}input,select{background:#121b1b;color:white;border:1px solid #52605a;border-radius:10px;padding:10px;min-width:0;font-size:16px}input[type=number]{width:76px}.exercise{border-top:1px solid #3b4b47;padding:15px 0}.exercise:first-child{border-top:0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:9px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#172020;border-top:1px solid #394843;padding-bottom:env(safe-area-inset-bottom);z-index:3}.tabs button{flex:1;padding:14px 2px;background:none;color:#a9b9b2;border:0;font-size:12px}.tabs button.active{color:#b7f16c;font-weight:800}.hidden{display:none}.metric{font-size:27px;font-weight:800;color:#b7f16c}.notice{border-left:3px solid #b7f16c;padding-left:12px;line-height:1.6}#clock{font-size:48px;font-weight:800;text-align:center;letter-spacing:2px}.history-item{padding:12px 0;border-top:1px solid #394843}.pill{border:1px solid #4a5a54;border-radius:999px;padding:5px 9px;font-size:12px}button:focus-visible,input:focus-visible{outline:2px solid #b7f16c}p{line-height:1.55}</style></head><body><main><header class="flex"><div><div class="brand">FORM AI</div><h1 id="heading">나만의 운동 코치</h1></div><select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="de">Deutsch</option><option value="en">English</option></select></header><section id="home"><div class="panel"><small data-t="today">오늘의 운동</small><h2 data-t="plan">전신 기본 루틴</h2><p class="muted" data-t="intro">무게와 횟수를 기록하면 코치가 다음 운동을 제안해요.</p><button class="btn" onclick="tab('workout')" data-t="start">운동 시작</button></div><div class="panel flex"><div><small data-t="completed">완료한 세트</small><div class="metric" id="setCount">0</div></div><div><small data-t="sessions">기록된 운동일</small><div class="metric" id="dayCount">0</div></div></div><div class="panel"><h2 data-t="tip">오늘의 코칭</h2><p id="homeTip" class="notice"></p><button class="btn secondary" onclick="speak(document.getElementById('homeTip').textContent)" data-t="listen">음성으로 듣기</button></div></section><section id="workout" class="hidden"><h2 data-t="workout">운동 기록</h2><p class="muted" data-t="weightHint">운동별 무게(kg), 반복 횟수를 입력하고 세트를 저장하세요.</p><div id="exercises" class="panel"></div><div class="panel"><small data-t="rest">휴식 타이머</small><div id="clock">01:30</div><div class="row" style="justify-content:center"><button class="btn secondary" onclick="startTimer()" data-t="timerStart">시작</button><button class="btn secondary" onclick="resetTimer()" data-t="reset">초기화</button><select id="restSeconds" onchange="resetTimer()"><option value="60">60s</option><option value="90" selected>90s</option><option value="120">120s</option><option value="180">180s</option></select></div></div></section><section id="coach" class="hidden"><h2 data-t="coach">운동 코치</h2><div class="panel"><p id="coachText" class="notice"></p><button class="btn" onclick="speak(document.getElementById('coachText').textContent)" data-t="listen">음성으로 듣기</button><button class="btn secondary" onclick="updateAll()" data-t="refresh">분석 새로고침</button></div><div class="panel"><small data-t="limitation">현재 버전은 저장된 기록에 기반한 규칙형 코치입니다. 생성형 AI 채팅은 아직 연결되지 않았습니다.</small></div></section><section id="history" class="hidden"><h2 data-t="history">운동 기록</h2><div class="panel" id="historyList"></div><button class="btn secondary" onclick="exportData()" data-t="export">기록 내보내기</button><p><button class="btn secondary" onclick="clearData()" data-t="delete">전체 기록 삭제</button></p></section><footer><small data-t="disclaimer">통증이 발생하면 운동을 중단하고 전문가와 상담하세요.</small></footer></main><nav class="tabs"><button id="nav-home" onclick="tab('home')">⌂ <span data-t="home">홈</span></button><button id="nav-workout" onclick="tab('workout')">▣ <span data-t="workout">운동</span></button><button id="nav-coach" onclick="tab('coach')">✦ <span data-t="coach">코치</span></button><button id="nav-history" onclick="tab('history')">▥ <span data-t="history">기록</span></button></nav><script>
const dict={ko:{heading:'나만의 운동 코치',today:'오늘의 운동',plan:'전신 기본 루틴',intro:'무게와 횟수를 기록하면 코치가 다음 운동을 제안해요.',start:'운동 시작',completed:'완료한 세트',sessions:'기록된 운동일',tip:'오늘의 코칭',listen:'음성으로 듣기',workout:'운동',weightHint:'운동별 무게(kg), 반복 횟수를 입력하고 세트를 저장하세요.',rest:'휴식 타이머',timerStart:'시작',reset:'초기화',coach:'코치',refresh:'분석 새로고침',limitation:'현재 버전은 저장된 기록에 기반한 규칙형 코치입니다. 생성형 AI 채팅은 아직 연결되지 않았습니다.',history:'기록',export:'기록 내보내기',delete:'전체 기록 삭제',disclaimer:'통증이 발생하면 운동을 중단하고 전문가와 상담하세요.',home:'홈',save:'세트 저장',kg:'무게 kg',reps:'횟수',empty:'아직 운동 기록이 없습니다. 첫 세트를 기록해보세요.',first:'첫 운동을 시작해보세요. 가벼운 무게로 자세를 익히고 무리하지 마세요.',progress:'최근 운동을 기록했어요. 다음 운동에서는 같은 무게로 정확한 자세와 반복 횟수를 먼저 유지해보세요.',good:'최근 같은 종목에서 반복 횟수가 증가했어요. 자세가 안정적이고 여유가 있다면 다음 운동에서 소폭 증량을 고려하세요.',saved:'세트가 저장되었습니다.',confirm:'모든 운동 기록을 삭제할까요?',finished:'휴식이 끝났습니다. 다음 세트를 준비하세요.',exercise:['스쿼트','벤치프레스','랫풀다운','숄더프레스','플랭크']},de:{heading:'Dein Trainingscoach',today:'Heutiges Training',plan:'Ganzkörper-Basisplan',intro:'Gewicht und Wiederholungen erfassen und Empfehlungen erhalten.',start:'Training starten',completed:'Erfasste Sätze',sessions:'Trainingstage',tip:'Dein Coaching',listen:'Vorlesen',workout:'Training',weightHint:'Gewicht (kg) und Wiederholungen eingeben und Satz speichern.',rest:'Pausentimer',timerStart:'Start',reset:'Zurücksetzen',coach:'Coach',refresh:'Analyse aktualisieren',limitation:'Diese Version nutzt regelbasierte Empfehlungen aus deinen Daten. Generative KI ist noch nicht verbunden.',history:'Verlauf',export:'Daten exportieren',delete:'Alle Daten löschen',disclaimer:'Bei Schmerzen Training abbrechen und medizinischen Rat einholen.',home:'Start',save:'Satz speichern',kg:'Gewicht kg',reps:'Wdh.',empty:'Noch keine Trainingsdaten. Erfasse deinen ersten Satz.',first:'Starte mit einem leichten Gewicht und konzentriere dich auf saubere Technik.',progress:'Training gespeichert. Halte beim nächsten Mal zuerst Gewicht und Technik konstant.',good:'Mehr Wiederholungen beim gleichen Gewicht! Wenn die Technik stimmt, kannst du eine kleine Steigerung erwägen.',saved:'Satz gespeichert.',confirm:'Alle Trainingsdaten löschen?',finished:'Pause beendet. Bereit für den nächsten Satz.',exercise:['Kniebeuge','Bankdrücken','Latzug','Schulterdrücken','Plank']},en:{heading:'Your fitness coach',today:"Today's workout",plan:'Full-body starter plan',intro:'Log weight and reps to get your next-workout guidance.',start:'Start workout',completed:'Sets logged',sessions:'Workout days',tip:"Today's coaching",listen:'Read aloud',workout:'Workout',weightHint:'Enter weight (kg) and repetitions, then save the set.',rest:'Rest timer',timerStart:'Start',reset:'Reset',coach:'Coach',refresh:'Refresh analysis',limitation:'This version provides rule-based guidance from your saved records. Generative AI chat is not connected yet.',history:'History',export:'Export records',delete:'Delete all records',disclaimer:'Stop exercising if you experience pain and seek professional advice.',home:'Home',save:'Save set',kg:'Weight kg',reps:'Reps',empty:'No workout records yet. Log your first set.',first:'Start with a light weight and focus on good technique.',progress:'Workout saved. Keep your technique and weight consistent next time.',good:'You increased reps at the same weight! Consider a small increase if your form feels solid.',saved:'Set saved.',confirm:'Delete all workout records?',finished:'Rest complete. Get ready for your next set.',exercise:['Squat','Bench press','Lat pulldown','Shoulder press','Plank']}};
const ids=['squat','bench','lat','shoulder','plank'];let language=localStorage.getItem('formai-lang')||'ko';let records=[];try{const parsed=JSON.parse(localStorage.getItem('formai-records')||'[]');if(Array.isArray(parsed))records=parsed.filter(x=>x&&ids.includes(x.exercise)&&Number.isFinite(x.weight)&&Number.isInteger(x.reps));}catch(e){}let timerId=null,endAt=0,remaining=90;
function t(k){return dict[language][k]}function save(){try{localStorage.setItem('formai-records',JSON.stringify(records))}catch(e){alert('Storage unavailable')}}function tab(name){['home','workout','coach','history'].forEach(x=>{document.getElementById(x).classList.toggle('hidden',x!==name);document.getElementById('nav-'+x).classList.toggle('active',x===name)});updateAll()}
function renderLanguage(){document.documentElement.lang=language;document.getElementById('lang').value=language;document.getElementById('heading').textContent=t('heading');document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));document.getElementById('exercises').innerHTML=ids.map((id,i)=>`<div class="exercise"><b>${t('exercise')[i]}</b><div class="row"><label><small>${t('kg')}</small><br><input id="w-${id}" type="number" inputmode="decimal" min="0" max="1000" step="0.5" value="${lastWeight(id)}"></label><label><small>${t('reps')}</small><br><input id="r-${id}" type="number" inputmode="numeric" min="1" max="1000" step="1" value="10"></label><button class="btn" onclick="addSet('${id}')">${t('save')}</button></div></div>`).join('');updateAll()}
function lastWeight(id){const x=[...records].reverse().find(r=>r.exercise===id);return x?x.weight:0}function addSet(id){const w=Number(document.getElementById('w-'+id).value),r=Number(document.getElementById('r-'+id).value);if(!Number.isFinite(w)||w<0||w>1000||!Number.isInteger(r)||r<1||r>1000){alert('Invalid weight or repetitions');return}records.push({exercise:id,weight:w,reps:r,date:new Date().toISOString()});save();updateAll();startTimer();speak(t('saved'))}
function coachMessage(){if(!records.length)return t('first');const last=records[records.length-1];const prior=[...records].slice(0,-1).reverse().find(x=>x.exercise===last.exercise&&x.weight===last.weight);return prior&&last.reps>prior.reps?t('good'):t('progress')}
function updateAll(){document.getElementById('setCount').textContent=records.length;document.getElementById('dayCount').textContent=new Set(records.map(r=>new Date(r.date).toLocaleDateString('en-CA'))).size;document.getElementById('homeTip').textContent=coachMessage();document.getElementById('coachText').textContent=coachMessage();document.getElementById('historyList').innerHTML=records.length?[...records].reverse().slice(0,100).map(r=>`<div class="history-item"><b>${t('exercise')[ids.indexOf(r.exercise)]}</b> · ${r.weight} kg × ${r.reps}<br><small>${new Date(r.date).toLocaleString(language)}</small></div>`).join(''):t('empty')}
function clock(){let sec=timerId?Math.max(0,Math.ceil((endAt-Date.now())/1000)):remaining;document.getElementById('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(timerId&&sec===0){clearInterval(timerId);timerId=null;remaining=0;speak(t('finished'));if('vibrate' in navigator)navigator.vibrate([200,100,200])}}
function startTimer(){if(timerId)clearInterval(timerId);remaining=Number(document.getElementById('restSeconds').value);endAt=Date.now()+remaining*1000;timerId=setInterval(clock,250);clock()}function resetTimer(){if(timerId)clearInterval(timerId);timerId=null;remaining=Number(document.getElementById('restSeconds').value);clock()}
function speak(message){if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(message);u.lang={ko:'ko-KR',de:'de-DE',en:'en-US'}[language];u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u)}function exportData(){const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='form-ai-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}function clearData(){if(confirm(t('confirm'))){records=[];save();renderLanguage()}}document.getElementById('lang').addEventListener('change',e=>{language=e.target.value;localStorage.setItem('formai-lang',language);renderLanguage()});renderLanguage();resetTimer();tab('home');
</script></body></html>
