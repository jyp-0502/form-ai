<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101716"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FORM AI"><title>FORM AI 0.2</title><style>
:root{color-scheme:dark;--bg:#101716;--card:#222c2a;--text:#f4f7f5;--muted:#a8b7b1;--lime:#baf078}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px calc(95px + env(safe-area-inset-bottom));}header{display:flex;justify-content:space-between;align-items:center;padding:28px 4px 20px}.brand{font-size:15px;letter-spacing:3px;color:var(--lime);font-weight:800}h1{font-size:27px;margin:8px 0}h2{font-size:21px;margin:0 0 15px}.card{background:var(--card);border-radius:22px;padding:20px;margin-bottom:15px}.muted,small{color:var(--muted)}.muted{line-height:1.55}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.btn{background:var(--lime);color:#10200b;border:0;border-radius:13px;padding:13px 17px;font-size:15px;font-weight:750;cursor:pointer}.btn.alt{background:#394844;color:white}.btn:disabled{opacity:.5}input,select,textarea{background:#17211f;border:1px solid #54645d;color:white;border-radius:11px;padding:12px;font:inherit;max-width:100%}input[type=number]{width:92px}select{min-width:100px}textarea{width:100%;min-height:75px}.hidden{display:none!important}.pill{padding:10px 13px;border-radius:20px;background:#34413d;color:#f1f4f2;border:0;font-weight:600}.pill.active{background:var(--lime);color:#12200b}.chips{display:flex;gap:7px;overflow-x:auto;padding:3px 0 13px}.exercise{padding:14px 0;border-top:1px solid #41504b}.exercise:first-child{border:0}.exercise button{width:100%;text-align:left;border:0;border-radius:12px;padding:14px;background:#34413d;color:white;font:inherit}.exercise button.selected{background:#526947;outline:2px solid var(--lime)}.label{font-size:12px;color:var(--muted);margin-bottom:5px}.metric{font-size:30px;color:var(--lime);font-weight:750}.coach{border-left:4px solid var(--lime);padding:8px 12px;line-height:1.6;background:#293632;border-radius:0 10px 10px 0;white-space:pre-line}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#18211f;border-top:1px solid #35413d;padding:12px 0 calc(12px + env(safe-area-inset-bottom));z-index:5}.nav button{background:none;color:#9baca5;border:0;font-size:13px;padding:7px}.nav button.active{color:var(--lime);font-weight:800}.history{padding:12px 0;border-bottom:1px solid #3a4742}.hint{font-size:12px;color:#c6d3cd}.space{height:10px}#clock{font-size:42px;font-weight:750;font-variant-numeric:tabular-nums}button:focus-visible,input:focus-visible{outline:2px solid var(--lime)} </style></head><body>
<header><div><div class="brand">FORM AI · 0.2</div><h1 id="pageTitle">나만의 운동 코치</h1></div><select id="language" aria-label="Language"><option value="ko">한국어</option><option value="de">Deutsch</option><option value="en">English</option></select></header>
<main>
<section id="home"><div class="card"><div class="label" data-i="welcome">오늘의 운동</div><h2 data-i="ready">오늘도 꾸준하게!</h2><p class="muted" data-i="intro">운동 종목을 직접 고르고 세트를 기록해 보세요.</p><button class="btn" onclick="tab('workout')" data-i="begin">운동 시작</button></div><div class="card row between"><div><div class="label" data-i="sets">기록한 세트</div><div class="metric" id="totalSets">0</div></div><div><div class="label" data-i="days">운동한 날짜</div><div class="metric" id="totalDays">0</div></div></div><div class="card"><h2 data-i="todayCoach">오늘의 코칭</h2><div class="coach" id="homeCoach"></div><div class="space"></div><button class="btn alt" onclick="speak(document.getElementById('homeCoach').textContent)" data-i="listen">🔊 음성 듣기</button></div></section>
<section id="workout" class="hidden"><div class="card"><h2 data-i="choose">운동 종목 선택</h2><div id="categories" class="chips"></div><div id="exerciseList"></div><div class="row"><input id="customName" maxlength="45" style="flex:1;min-width:130px" placeholder="직접 종목 추가"><button class="btn alt" onclick="addCustom()" data-i="add">추가</button></div></div><div class="card"><div class="label" data-i="selected">선택한 운동</div><h2 id="selectedName">—</h2><div id="previous" class="muted"></div><div class="space"></div><div class="row"><label><div class="label" data-i="weight">무게 (kg)</div><input id="weight" type="number" min="0" max="1000" step="0.5" inputmode="decimal" value="0"></label><label><div class="label" data-i="reps">횟수</div><input id="reps" type="number" min="1" max="1000" step="1" inputmode="numeric" value="10"></label><label><div class="label" data-i="effort">난이도</div><select id="effort"><option value="easy">쉬움</option><option value="ok" selected>적당</option><option value="hard">힘듦</option></select></label></div><div class="space"></div><button id="saveSet" class="btn" onclick="saveSet()" data-i="save">세트 완료 및 저장</button></div><div class="card"><h2 data-i="rest">휴식 타이머</h2><div class="row between"><div id="clock">01:30</div><select id="restTime" onchange="resetTimer()"><option value="60">60s</option><option value="90" selected>90s</option><option value="120">120s</option><option value="180">180s</option></select></div><div class="space"></div><div class="row"><button class="btn" onclick="startTimer()" data-i="start">시작</button><button class="btn alt" onclick="resetTimer()" data-i="reset">초기화</button></div></div><div class="card"><h2 data-i="recommend">다음 세트 코칭</h2><div class="coach" id="workoutCoach"></div><div class="space"></div><button class="btn alt" onclick="speak(document.getElementById('workoutCoach').textContent)" data-i="listen">🔊 음성 듣기</button></div></section>
<section id="coach" class="hidden"><div class="card"><h2 data-i="coachTitle">기록 기반 코치</h2><p class="muted" data-i="coachDesc">최근 운동과 선택한 종목을 기준으로 다음 세트를 추천해요. 의학적 진단이나 실시간 자세 분석은 제공하지 않아요.</p><div class="coach" id="coachText"></div><div class="space"></div><button class="btn alt" onclick="speak(document.getElementById('coachText').textContent)" data-i="listen">🔊 음성 듣기</button></div></section>
<section id="history" class="hidden"><div class="card"><h2 data-i="historyTitle">운동 기록</h2><div id="historyList"></div><div class="space"></div><button class="btn alt" onclick="exportData()" data-i="export">JSON 백업 다운로드</button> <button class="btn alt" onclick="document.getElementById('importFile').click()" data-i="import">백업 복원</button><input class="hidden" id="importFile" type="file" accept=".json,application/json" onchange="importData(event)"><div class="space"></div><button class="btn alt" onclick="clearData()" data-i="clear">모든 기록 삭제</button><p class="hint" data-i="storage">기록은 현재 브라우저에 저장됩니다. 다른 기기나 브라우저로 자동 동기화되지 않습니다.</p></div></section>
</main><nav class="nav"><button id="nav-home" onclick="tab('home')">⌂ <span data-i="home">홈</span></button><button id="nav-workout" onclick="tab('workout')">▣ <span data-i="workout">운동</span></button><button id="nav-coach" onclick="tab('coach')">✦ <span data-i="coach">코치</span></button><button id="nav-history" onclick="tab('history')">▤ <span data-i="history">기록</span></button></nav>

en:{title:'Your workout coach',welcome:"Today's workout",ready:'Keep showing up!',intro:'Choose your exercises and log your sets.',begin:'Start workout',sets:'Logged sets',days:'Workout days',todayCoach:"Today's coaching",listen:'🔊 Listen',choose:'Choose exercise',add:'Add',selected:'Selected exercise',weight:'Weight (kg)',reps:'Reps',effort:'Effort',save:'Finish & save set',rest:'Rest timer',start:'Start',reset:'Reset',recommend:'Next set coaching',coachTitle:'Record-based coach',coachDesc:'Suggestions based on logged sets, not medical advice or live form analysis.',historyTitle:'Workout history',export:'Download JSON backup',import:'Restore backup',clear:'Delete all records',storage:'Records stay in this browser; no automatic sync.',home:'Home',workout:'Workout',coach:'Coach',history:'History',previous:'Previous',none:'No previous set. Start light and prioritize form.',saved:'Set saved. Rest timer started.',timerDone:'Rest is over. Get ready for the next set.',deleteConfirm:'Delete all workout records? This cannot be undone.',invalid:'Check weight and reps.',added:'Exercise added.',duplicate:'Exercise already exists.',chooseFirst:'Choose an exercise first.',easy:'Easy',ok:'Moderate',hard:'Hard',categories:['All','Chest','Back','Shoulders','Legs','Arms','Core','Cardio','Other'],introCoach:'Log your first set. Prioritize form and a manageable load.',tipEasy:'If it felt easy, consider 1–2 more reps or a small weight increase only with good form.',tipOk:'Maintain this weight and rep target if effort felt moderate.',tipHard:'Rest well. Consider fewer reps or a lighter weight next set.',tipProgress:'More reps at the same weight than last time. Nice progress.',tipDrop:'Fewer reps than last time. Check fatigue and avoid pushing too hard.',tipPain:'Stop if you experience pain and seek professional guidance.',customPlaceholder:'Add custom exercise',recorded:'Logged',noHistory:'No workout history yet.',importDone:'Backup restored.',importFail:'Could not read backup.'},
de:{title:'Dein Trainingscoach',welcome:'Heutiges Training',ready:'Bleib dran!',intro:'Wähle Übungen aus und dokumentiere deine Sätze.',begin:'Training starten',sets:'Gespeicherte Sätze',days:'Trainingstage',todayCoach:'Heutiger Tipp',listen:'🔊 Vorlesen',choose:'Übung auswählen',add:'Hinzufügen',selected:'Gewählte Übung',weight:'Gewicht (kg)',reps:'Wiederholungen',effort:'Anstrengung',save:'Satz speichern',rest:'Pausentimer',start:'Start',reset:'Zurücksetzen',recommend:'Tipp für nächsten Satz',coachTitle:'Coach anhand deiner Daten',coachDesc:'Empfehlungen aus Trainingsdaten, keine medizinische Beratung oder Live-Technikanalyse.',historyTitle:'Trainingsverlauf',export:'JSON-Sicherung laden',import:'Sicherung wiederherstellen',clear:'Alle Daten löschen',storage:'Daten bleiben in diesem Browser; keine automatische Synchronisierung.',home:'Start',workout:'Training',coach:'Coach',history:'Verlauf',previous:'Vorheriger Satz',none:'Noch keine Daten. Beginne leicht und achte auf die Technik.',saved:'Satz gespeichert. Pause beginnt.',timerDone:'Pause vorbei. Bereite den nächsten Satz vor.',deleteConfirm:'Alle Trainingsdaten unwiderruflich löschen?',invalid:'Bitte Gewicht und Wiederholungen prüfen.',added:'Übung hinzugefügt.',duplicate:'Übung bereits vorhanden.',chooseFirst:'Wähle zuerst eine Übung.',easy:'Leicht',ok:'Mittel',hard:'Schwer',categories:['Alle','Brust','Rücken','Schultern','Beine','Arme','Bauch','Ausdauer','Sonstige'],introCoach:'Trage deinen ersten Satz ein. Technik und passende Belastung sind wichtig.',tipEasy:'Wenn es leicht war, erwäge 1–2 Wiederholungen mehr oder eine kleine Gewichtssteigerung bei guter Technik.',tipOk:'Behalte Gewicht und Wiederholungen bei, wenn die Belastung passend war.',tipHard:'Pausiere ausreichend und reduziere ggf. Gewicht oder Wiederholungen.',tipProgress:'Mehr Wiederholungen bei gleichem Gewicht als zuvor. Guter Fortschritt.',tipDrop:'Weniger Wiederholungen als zuvor. Achte auf Ermüdung.',tipPain:'Bei Schmerzen abbrechen und fachlichen Rat einholen.',customPlaceholder:'Eigene Übung hinzufügen',recorded:'Gespeichert',noHistory:'Noch keine Trainingsdaten.',importDone:'Sicherung wiederhergestellt.',importFail:'Sicherung konnte nicht gelesen werden.'}};
const catalog=[
['bench','chest',['벤치프레스','Bench press','Bankdrücken']],['incline','chest',['인클라인 덤벨프레스','Incline dumbbell press','Schrägbankdrücken']],['fly','chest',['체스트 플라이','Chest fly','Butterfly']],
['lat','back',['랫풀다운','Lat pulldown','Latzug']],['row','back',['시티드 로우','Seated row','Rudern sitzend']],['deadlift','back',['데드리프트','Deadlift','Kreuzheben']],
['shoulder','shoulders',['숄더프레스','Shoulder press','Schulterdrücken']],['lateral','shoulders',['사이드 레터럴 레이즈','Lateral raise','Seitheben']],
['squat','legs',['스쿼트','Squat','Kniebeuge']],['legpress','legs',['레그프레스','Leg press','Beinpresse']],['legcurl','legs',['레그컬','Leg curl','Beinbeuger']],
['curl','arms',['바이셉 컬','Biceps curl','Bizepscurls']],['pushdown','arms',['트라이셉 푸시다운','Triceps pushdown','Trizepsdrücken']],
['plank','core',['플랭크','Plank','Plank']],['crunch','core',['크런치','Crunch','Crunch']],
['walk','cardio',['트레드밀 걷기','Treadmill walk','Laufband Gehen']],['bike','cardio',['실내 자전거','Stationary bike','Ergometer']]
].map(([id,cat,names])=>({id,cat,names}));
const catIds=['all','chest','back','shoulders','legs','arms','core','cardio','other'];
const oldIds=['squat','bench','lat','shoulder','plank'];
let lang=localStorage.getItem('formai-lang')||'ko';if(!D[lang])lang='ko';
let records=[],custom=[],selected=localStorage.getItem('formai-selected')||'bench',category='all',timer=null,end=0,remaining=90;
try{let x=JSON.parse(localStorage.getItem('formai-records')||'[]');if(Array.isArray(x))records=x.filter(validRecord).map(r=>({...r,effort:r.effort||'ok'}))}catch(e){}
try{let x=JSON.parse(localStorage.getItem('formai-custom')||'[]');if(Array.isArray(x))custom=x.filter(v=>v&&typeof v.id==='string'&&typeof v.name==='string'&&v.name.length<=45).slice(0,100)}catch(e){}
function validRecord(r){return r&&typeof r.exercise==='string'&&r.exercise.length<100&&Number.isFinite(r.weight)&&r.weight>=0&&r.weight<=1000&&Number.isInteger(r.reps)&&r.reps>=1&&r.reps<=1000&&typeof r.date==='string'&&!isNaN(Date.parse(r.date))}
function tr(k){return D[lang][k]}function allEx(){return catalog.concat(custom.map(x=>({id:x.id,cat:'other',names:[x.name,x.name,x.name]})))}function exName(id){let x=allEx().find(v=>v.id===id);return x?x.names[{ko:0,en:1,de:2}[lang]]:id}
function persist(){try{localStorage.setItem('formai-records',JSON.stringify(records))}catch(e){alert('Storage full or unavailable')}}function tab(id){for(let n of ['home','workout','coach','history']){document.getElementById(n).classList.toggle('hidden',id!==n);document.getElementById('nav-'+n).classList.toggle('active',id===n)}update()}
function renderLang(){document.documentElement.lang=lang;document.getElementById('language').value=lang;document.getElementById('pageTitle').textContent=tr('title');document.querySelectorAll('[data-i]').forEach(el=>el.textContent=tr(el.dataset.i));document.getElementById('customName').placeholder=tr('customPlaceholder');document.getElementById('effort').querySelectorAll('option').forEach(o=>o.textContent=tr(o.value));renderCategories();renderExercises();selectExercise(selected,false);update()}
function renderCategories(){document.getElementById('categories').innerHTML=catIds.map((c,i)=>`<button class="pill ${category===c?'active':''}" data-cat="${c}">${tr('categories')[i]}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderCategories();renderExercises()})}
function renderExercises(){document.getElementById('exerciseList').innerHTML=allEx().filter(e=>category==='all'||e.cat===category).map(e=>`<div class="exercise"><button data-ex="${e.id}" class="${selected===e.id?'selected':''}">${escapeHtml(exName(e.id))}</button></div>`).join('');document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>selectExercise(b.dataset.ex,true))}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selectExercise(id,resetFields){if(!allEx().some(x=>x.id===id))id='bench';selected=id;localStorage.setItem('formai-selected',id);document.getElementById('selectedName').textContent=exName(id);const prev=[...records].reverse().find(x=>x.exercise===id);document.getElementById('previous').textContent=prev?`${tr('previous')}: ${prev.weight} kg × ${prev.reps}`:tr('none');if(resetFields){document.getElementById('weight').value=prev?prev.weight:0;document.getElementById('reps').value=prev?prev.reps:10}renderExercises();updateCoach()}
function addCustom(){let name=document.getElementById('customName').value.trim();if(!name)return;if(allEx().some(x=>x.names.some(n=>n.toLowerCase()===name.toLowerCase()))){alert(tr('duplicate'));return}let id='custom-'+Date.now().toString(36);custom.push({id,name});localStorage.setItem('formai-custom',JSON.stringify(custom));document.getElementById('customName').value='';category='all';renderCategories();selectExercise(id,true);alert(tr('added'))}
function saveSet(){if(!selected){alert(tr('chooseFirst'));return}let w=Number(document.getElementById('weight').value),r=Number(document.getElementById('reps').value);if(!Number.isFinite(w)||w<0||w>1000||!Number.isInteger(r)||r<1||r>1000){alert(tr('invalid'));return}records.push({exercise:selected,weight:w,reps:r,effort:document.getElementById('effort').value,date:new Date().toISOString()});persist();update();selectExercise(selected,false);startTimer();speak(tr('saved'))}
function coachMessage(){let current=[...records].reverse().find(r=>r.exercise===selected);if(!current)return tr('introCoach');let prior=[...records].slice(0,records.lastIndexOf(current)).reverse().find(r=>r.exercise===selected&&r.weight===current.weight);let msg=`${exName(selected)} · ${current.weight} kg × ${current.reps}\n`;if(prior){if(current.reps>prior.reps)msg+=tr('tipProgress')+'\n';if(current.reps<prior.reps)msg+=tr('tipDrop')+'\n'}msg+=tr('tip'+({easy:'Easy',ok:'Ok',hard:'Hard'}[current.effort]||'Ok'));return msg}
function updateCoach(){let msg=coachMessage();for(let id of ['homeCoach','workoutCoach','coachText'])document.getElementById(id).textContent=msg}
function update(){document.getElementById('totalSets').textContent=records.length;document.getElementById('totalDays').textContent=new Set(records.map(x=>new Date(x.date).toLocaleDateString('en-CA'))).size;updateCoach();document.getElementById('historyList').innerHTML=records.length?[...records].reverse().slice(0,150).map(r=>`<div class="history"><b>${escapeHtml(exName(r.exercise))}</b> · ${r.weight} kg × ${r.reps}<br><small>${new Date(r.date).toLocaleString(lang==='ko'?'ko-KR':lang==='de'?'de-DE':'en-US')} · ${tr(r.effort)||tr('ok')}</small></div>`).join(''):tr('noHistory')}
function tick(){let sec=timer?Math.max(0,Math.ceil((end-Date.now())/1000)):remaining;document.getElementById('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(timer&&sec===0){clearInterval(timer);timer=null;remaining=0;speak(tr('timerDone'));if(navigator.vibrate)navigator.vibrate(200)}}
function startTimer(){if(timer)clearInterval(timer);remaining=Number(document.getElementById('restTime').value);end=Date.now()+remaining*1000;timer=setInterval(tick,250);tick()}function resetTimer(){if(timer)clearInterval(timer);timer=null;remaining=Number(document.getElementById('restTime').value);tick()}
function speak(message){if(!('speechSynthesis'in window)){alert('Speech not supported');return}let u=new SpeechSynthesisUtterance(message);u.lang={ko:'ko-KR',en:'en-US',de:'de-DE'}[lang];u.rate=.95;speechSynthesis.cancel();speechSynthesis.speak(u)}
function exportData(){let blob=new Blob([JSON.stringify({version:2,records,custom},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='form-ai-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function importData(ev){try{let obj=JSON.parse(await ev.target.files[0].text());let r=Array.isArray(obj)?obj:obj.records;if(!Array.isArray(r)||!r.every(validRecord))throw Error();if(obj.custom&&Array.isArray(obj.custom))custom=obj.custom.filter(x=>x&&typeof x.id==='string'&&x.id.startsWith('custom-')&&typeof x.name==='string'&&x.name.length<=45).slice(0,100);records=r.map(x=>({...x,effort:['easy','ok','hard'].includes(x.effort)?x.effort:'ok'}));localStorage.setItem('formai-custom',JSON.stringify(custom));persist();renderLang();alert(tr('importDone'))}catch(e){alert(tr('importFail'))}ev.target.value=''}
function clearData(){if(confirm(tr('deleteConfirm'))){records=[];persist();renderLang()}}
document.getElementById('language').onchange=e=>{lang=e.target.value;localStorage.setItem('formai-lang',lang);renderLang()};renderLang();resetTimer();tab('home');
</script></body></html>
